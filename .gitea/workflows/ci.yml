name: CI Checks

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  linting:
    name: Ruff Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        env:
          GIT_SSL_NO_VERIFY: "true"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff check
        run: ruff check .
  
  test_full_compatibility:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: linting
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.13", "3.14"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        env:
          GIT_SSL_NO_VERIFY: "true"

      - name: Set up Python ${{ matrix.python-version }}
        if: matrix.python-version != '3.6'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Gettext)
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Setup Environment (Modern)
        if: matrix.python-version != '3.6'
        run: |
          echo ">>> Environment: Modern (${{ matrix.python-version }})"
          python -m pip install --quiet --upgrade pip
          pip install -e ".[all]"

      - name: Compile Translations
        run: |
          echo ">>> Compiling Translations inside src structure"
          find src/check_truststore/locale -name "*.po" | while read po_file; do
            mo_file="${po_file%.po}.mo"
            echo "Compiling $po_file -> $mo_file"
            msgfmt "$po_file" -o "$mo_file"
          done

      - name: Run Analyzer
        run: |
          echo ">>> Running Analyzer on Python ${{ matrix.python-version }}"
          chmod +x check_truststore
          ./check_truststore --mock --format text -d
          ./check_truststore --mock --format json > output_${{ matrix.python-version }}.json
          python -m json.tool output_${{ matrix.python-version }}.json > /dev/null

      - name: Upload Artifacts on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: output-json-${{ matrix.python-version }}
          path: output_*.json
          retention-days: 2
---
env: tst
certificate_file_extension: ".crt"

truststores:
  - name: internal_test_store
    cert_src_dir: "files/certificates/{{ env }}/trust"
    cert_chain:
      - link: root
      - link: int-valid
      - link: int-expiring
      - link: int-noca
      - link: int-expired
      - link: server-ok
      - link: server-expiring
      - link: server-broken
      - link: server-legacy
      - link: server-collision
      - link: orphan
      - link: root_fake
      - link: leaf_broken_sign
      - link: non_existing
